name: Build MAX ULTRA EDITOR APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project ZIP
        run: |
          unzip -o Max_Ultra_Editor_Android_Project.zip -d project
          find project -maxdepth 3 -type f | head -80

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAX-ULTRA-EDITOR-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
